version: 1.3.13

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1/"
      models:
        default:
          - "qwen3-coder:30b"
        fetch: false
      titleConvo: true
      titleModel: "qwen3-coder:30b"
      summarize: false
      summaryModel: "qwen3-coder:30b"
      modelDisplayLabel: "Ollama"

actions:
  allowedAddresses:
    - "host.docker.internal:3003"
  allowedDomains:
    - "http://host.docker.internal:3003"
